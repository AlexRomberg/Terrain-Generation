@for (parameter of layer().parameters; track $index) {
  <div>
    <label
      [for]="'param-' + layer().name + '-' + parameter.label"
      class="block text-sm font-medium text-stone-300"
      >{{ parameter.label }}</label
    >
    <input
      [id]="'param-' + layer().name + '-' + parameter.label"
      type="range"
      class="w-full h-2 bg-stone-700 rounded-lg appearance-none cursor-pointer"
      [ngModel]="parameter.value"
      (ngModelChange)="parameter.set($event)"
    />
  </div>
}
