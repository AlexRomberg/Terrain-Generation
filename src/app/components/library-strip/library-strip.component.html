@if (library.message(); as message) {
  <p
    class="flex items-center gap-1 rounded-md bg-stone-200/80 px-2 py-1 text-sm text-red-700 backdrop-blur-sm dark:bg-stone-800/80 dark:text-red-400"
    role="alert"
  >
    {{ message }}
    <button class="action" title="Dismiss" (click)="library.message.set(undefined)">
      <svg lucideX class="size-3"></svg>
    </button>
  </p>
}

<div class="flex max-w-full items-stretch gap-2 overflow-x-auto p-1">
  @for (entry of library.entries(); track entry.id) {
    @let active = entry.id === library.activeId();
    <div class="tile group backdrop-blur-sm" [class.ring-2]="active" [class.ring-cyan-500]="active">
      <button
        class="thumbnail"
        [title]="'Apply ' + entry.name"
        [disabled]="library.busy()"
        (click)="apply(entry)"
      >
        @if (entry.thumbnail) {
          <img class="size-full object-cover" [src]="entry.thumbnail" [alt]="entry.name" />
        }
      </button>
      <div
        class="absolute top-2 right-2 hidden gap-0.5 rounded-md bg-stone-100/90 p-0.5 group-focus-within:flex group-hover:flex dark:bg-stone-900/90"
      >
        <button class="action" title="Rename" (click)="startRename(entry)">
          <svg lucidePencil class="size-4"></svg>
        </button>
        <button class="action" title="Delete" (click)="remove(entry)">
          <svg lucideTrash class="size-4"></svg>
        </button>
      </div>
      <div class="flex min-w-0 items-center gap-1 px-1">
        @if (renamingId() === entry.id) {
          <input
            appAutofocus
            class="w-full min-w-0 rounded bg-stone-100 px-1 text-sm dark:bg-stone-900"
            [(ngModel)]="renameValue"
            (keydown.enter)="commitRename(entry)"
            (keydown.escape)="renamingId.set(undefined)"
            (blur)="commitRename(entry)"
          />
        } @else {
          <span class="grow truncate text-sm" [title]="entry.name">{{ entry.name }}</span>
        }
      </div>
    </div>
  }

  @if (saveFormOpen()) {
    <form class="tile w-60 backdrop-blur-sm justify-between gap-2 p-2" (ngSubmit)="save()">
      <input
        appAutofocus
        name="name"
        class="rounded bg-stone-100 px-2 py-1 text-sm dark:bg-stone-900"
        [(ngModel)]="newName"
      />
      <div class="flex justify-end gap-1">
        <button type="button" class="text-button" (click)="saveFormOpen.set(false)">Cancel</button>
        <button type="submit" class="text-button bg-cyan-500 text-stone-950 hover:bg-cyan-400">
          Save
        </button>
      </div>
    </form>
  } @else {
    <button
      class="tile w-24 backdrop-blur-sm cursor-pointer items-center justify-center text-sm enabled:hover:bg-stone-300/70 disabled:cursor-default dark:enabled:hover:bg-stone-700/70"
      title="Save the current configuration as a preset"
      [disabled]="library.busy()"
      (click)="openSaveForm()"
    >
      @if (library.busy()) {
        <svg lucideLoaderCircle class="animate-spin"></svg>
        Saving…
      } @else {
        <svg lucidePlus></svg>
        Save
      }
    </button>
  }
</div>
