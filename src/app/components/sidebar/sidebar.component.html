<h1 class="p-6 text-3xl text-center flex justify-center gap-4">
  <img src="logo.svg" alt="Terrain-Simulator" class="w-10 h-10" />
  Terrain-Simulator
</h1>
<svg
  xmlns="http://www.w3.org/2000/svg"
  class="w-full h-14 mt-6"
  viewBox="0 0 96 20"
  preserveAspectRatio="none"
>
  <polygon
    points="5,20 40,3 80,20"
    fill="currentColor"
    class="fill-stone-600/70 dark:fill-stone-800/70"
  />
  <polygon
    points="0,20 96,0 96,20"
    fill="currentColor"
    class="fill-stone-600 dark:fill-stone-800"
  />
  <polygon points="0,20 0,2 96,20" fill="currentColor" class="fill-stone-700 dark:fill-stone-900" />
</svg>

<div
  cdkScrollable
  class="flex flex-col overflow-y-auto bg-stone-700 dark:bg-stone-900 text-stone-100"
>
  <span class="flex px-4 gap-2 items-center">
    <svg lucideLayers2></svg>
    <h2 class="text-xl">Filter Layers</h2>
  </span>
  <div class="card flex gap-2 items-center">
    <select
      id="addFilterLayer"
      class="grow bg-stone-700 p-2 rounded-lg"
      aria-label="Filter layer to add"
      [(ngModel)]="selectedFilterType"
    >
      @for (type of state.availableFilterLayers; track type.name) {
        <option [ngValue]="type">{{ type.name }}</option>
      }
    </select>
    <button
      class="icon-button"
      title="Add filter layer"
      aria-label="Add filter layer"
      (click)="state.addFilterLayer(selectedFilterType())"
    >
      <svg lucidePlus></svg>
    </button>
  </div>
  <div
    cdkDropList
    cdkDropListLockAxis="y"
    class="flex flex-col"
    (cdkDropListDropped)="dropFilterLayer($event)"
  >
    @for (filterLayer of filterLayersTopDown(); track filterLayer.id) {
      <div cdkDrag [cdkDragData]="filterLayer" class="card filter-card">
        <span class="flex items-center gap-1">
          <button
            cdkDragHandle
            class="cursor-grab! active:cursor-grabbing! text-zinc-500"
            title="Drag to reorder"
          >
            <svg lucideGripVertical></svg>
          </button>
          <button
            class="flex grow min-w-0 items-center gap-1 cursor-pointer text-left"
            (click)="filterLayer.collapsed.set(!filterLayer.collapsed())"
          >
            <span
              class="grid shrink-0 transition-transform"
              [class.rotate-90]="!filterLayer.collapsed()"
            >
              <svg lucideChevronRight></svg>
            </span>
            <h3 class="text-lg truncate" [class.disabled-filter]="!filterLayer.enabled()">
              {{ filterLayer.layer.name }}
            </h3>
          </button>
          <button
            class="icon-button"
            [title]="filterLayer.enabled() ? 'Disable' : 'Enable'"
            (click)="filterLayer.enabled.set(!filterLayer.enabled())"
          >
            @if (filterLayer.enabled()) {
              <svg lucideEye></svg>
            } @else {
              <svg lucideEyeOff></svg>
            }
          </button>
          <button
            class="icon-button"
            title="Remove"
            (click)="state.removeFilterLayer(filterLayer.id)"
          >
            <svg lucideTrash></svg>
          </button>
        </span>
        @if (!filterLayer.collapsed()) {
          <app-parameter-card
            class="block"
            [layer]="filterLayer.layer"
            [scope]="'filter-' + filterLayer.id"
          />
        }
      </div>
    }
  </div>

  <span class="flex px-4 mt-4 gap-2 items-center">
    <svg lucideLayers2></svg>
    <h2 class="text-xl">Base Layers</h2>
  </span>
  <div class="card">
    <select
      id="baseLayer"
      class="w-full bg-stone-700 p-2 rounded-lg mb-4"
      [(ngModel)]="state.selectedBaseLayer"
    >
      @for (layer of state.availableBaseLayers; track layer.name) {
        <option [ngValue]="layer">{{ layer.name }}</option>
      }
    </select>
    <app-parameter-card [layer]="state.selectedBaseLayer()" />
  </div>
</div>

<div
  class="grid grid-cols-[auto_1fr_auto] m-4 gap-2 bg-stone-300 dark:bg-stone-800 p-2 rounded-lg items-center"
>
  <label for="seed" class="text-nowrap">Seed:</label>
  <input id="seed" type="number" min="1" step="1" [(ngModel)]="state.seed" />
  <button
    class="cursor-pointer hover:bg-stone-400 active:bg-stone-500 dark:hover:bg-stone-700 dark:active:bg-stone-600 p-0.5 rounded-xs"
    (click)="setNewSeed()"
  >
    <svg lucideDice3></svg>
  </button>
</div>
