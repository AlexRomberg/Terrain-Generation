<div class="grid h-screen max-h-svh w-full grid-cols-[auto_1fr] bg-stone-200 dark:bg-stone-950">
  <div
    class="grid overflow-hidden"
    [class.w-96]="sidebarVisible()"
    [class.w-0]="!sidebarVisible()"
    [attr.inert]="sidebarVisible() ? null : ''"
  >
    <div class="grid w-96">
      <app-sidebar />
    </div>
  </div>
  <div
    class="relative m-2 grid overflow-hidden rounded-2xl shadow-lg shadow-stone-950/50 dark:shadow-black"
    [class.ml-0]="sidebarVisible()"
  >
    <app-canvas />
    <button
      class="absolute top-2 left-2 canvas-button"
      [title]="sidebarVisible() ? 'Hide sidebar' : 'Show sidebar'"
      (click)="sidebarVisible.set(!sidebarVisible())"
    >
      @if (sidebarVisible()) {
        <svg lucidePanelLeftClose></svg>
      } @else {
        <svg lucidePanelLeftOpen></svg>
      }
    </button>
  </div>
</div>
